   name: Crear RestOps.exe
   on:
     workflow_dispatch:
     push:
   jobs:
     build:
       runs-on: windows-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - run: pip install customtkinter pyinstaller
         - run: pyinstaller --noconsole --onefile --name RestOps --collect-all customtkinter Restaurante.py
         - uses: actions/upload-artifact@v4
           with:
             name: RestOps
             path: dist/RestOps.exe
